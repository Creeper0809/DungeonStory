<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DungeonStory 서사 검수실</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">DS</span><div><strong>서사 검수실</strong><small>V25 · 로컬 전용</small></div></div>
    <div class="progress-wrap" aria-label="전체 검수 진행도"><div class="progress-copy"><span id="progressText">불러오는 중</span><span id="saveState">로컬 연결 중</span></div><div class="progress-track"><span id="progressBar"></span></div></div>
    <div class="header-actions"><button id="undoButton" class="quiet" disabled>되돌리기 <kbd>U</kbd></button><button id="exportButton" class="quiet">CSV 내보내기</button></div>
  </header>

  <main class="workspace">
    <aside class="sidebar" aria-label="검수 필터와 분포">
      <section class="side-section filters">
        <div class="section-heading"><h2>검수 범위</h2><button id="resetFilters" class="text-button">초기화</button></div>
        <label>검색<input id="searchFilter" type="search" placeholder="사건·사실·후보 검색"></label>
        <label>상태<select id="statusFilter"><option value="">전체 상태</option><option value="unreviewed">미검수</option><option value="approved">승인</option><option value="rewrite">수정</option><option value="dropped">폐기</option></select></label>
        <label>프로필<select id="profileFilter"><option value="">전체 프로필</option></select></label>
        <label>문화<select id="cultureFilter"><option value="">전체 문화</option></select></label>
        <label>데이터 분할<select id="splitFilter"><option value="">전체 분할</option></select></label>
        <label>자동 경고<select id="warningFilter"><option value="">전체 경고</option></select></label>
        <label>유사 문장군<select id="clusterFilter"><option value="">전체 유사군</option></select></label>
      </section>
      <section class="side-section queue-section">
        <div class="section-heading"><h2>현재 목록</h2><span id="filterTotal">0건</span></div>
        <div id="recordList" class="record-list" role="listbox" aria-label="검수 레코드"></div>
        <button id="bulkLaunch" class="bulk-launch" disabled>현재 화면 일괄 처리</button>
        <div class="pager"><button id="prevPage" class="quiet">이전</button><span id="pageText">1 / 1</span><button id="nextPage" class="quiet">다음</button></div>
      </section>
      <section class="side-section distribution-section"><h2>표본 분포</h2><div id="distribution"></div></section>
    </aside>

    <section class="review-stage" aria-live="polite">
      <div id="emptyState" class="empty-state"><div class="sigil">◇</div><h1>검수 항목을 불러오는 중입니다</h1><p>데이터는 이 컴퓨터 밖으로 전송되지 않습니다.</p></div>
      <article id="reviewCard" class="review-card" hidden>
        <header class="record-header">
          <div><div class="eyebrow"><span id="recordId"></span><span id="splitBadge" class="badge"></span><span id="statusBadge" class="badge"></span></div><h1 id="eventTitle"></h1><p id="recordMeta"></p></div>
          <div class="cluster-summary"><span>유사 문장군</span><button id="clusterButton" class="cluster-button"></button></div>
        </header>

        <div class="review-body">
          <aside class="context-rail" aria-label="사실과 문화 모티프">
            <section class="context-panel"><h2>인물 사실</h2><div id="facts" class="fact-list"></div></section>
            <section class="context-panel motif-panel"><h2>문화 모티프</h2><div id="motifs" class="motif-list"></div></section>
            <details id="warningPanel" class="warning-panel" open><summary>자동 점검 <small>판단 보조</small></summary><div id="warningDetails"></div></details>
          </aside>

          <section class="candidate-grid" aria-label="후보 비교">
            <article id="candidateA" class="candidate" data-candidate="A">
              <header><div><span class="candidate-letter">A</span><h2>후보 A</h2></div><div id="warningsA" class="warning-pills"></div></header>
              <div id="candidateAView" class="candidate-view" tabindex="0"></div>
              <button id="approveA" class="approve">A 승인 <kbd>1</kbd></button>
            </article>
            <article id="candidateB" class="candidate" data-candidate="B">
              <header><div><span class="candidate-letter">B</span><h2>후보 B</h2></div><div id="warningsB" class="warning-pills"></div></header>
              <div id="candidateBView" class="candidate-view" tabindex="0"></div>
              <button id="approveB" class="approve">B 승인 <kbd>2</kbd></button>
            </article>
          </section>
        </div>

        <section class="decision-panel">
          <div class="decision-main"><div class="tag-editor"><span>문제 유형</span><div id="issueTags" class="tag-list"></div></div><label>검수 메모<textarea id="reviewNote" rows="2" placeholder="판단 근거나 수정 방향"></textarea></label></div>
          <div class="decision-actions"><button id="rewriteButton" class="secondary">직접 수정 <kbd>R</kbd></button><button id="dropButton" class="danger">폐기 <kbd>D</kbd></button><button id="skipButton" class="quiet">건너뛰기 <kbd>S</kbd></button></div>
        </section>
        <footer class="record-footer"><button id="previousRecord" class="quiet">← 이전</button><span><kbd>1</kbd>/<kbd>2</kbd> 승인 · <kbd>R</kbd> 수정 · <kbd>D</kbd> 폐기</span><button id="nextRecord" class="quiet">다음 →</button></footer>
      </article>
    </section>
  </main>

  <dialog id="rewriteDialog" class="rewrite-dialog">
    <form id="rewriteForm" method="dialog">
      <header><div><span class="eyebrow">문장만 수정</span><h2>규칙값은 그대로 두고 표현만 고칩니다</h2></div><button id="closeRewrite" type="button" class="text-button">닫기</button></header>
      <div class="rewrite-source"><span>기준 후보</span><label><input type="radio" name="rewriteBase" value="A" checked> A</label><label><input type="radio" name="rewriteBase" value="B"> B</label></div>
      <div id="rewriteFields" class="rewrite-fields"></div>
      <details class="raw-editor"><summary>고급: 완전한 JSON 확인·편집</summary><textarea id="rewriteText" spellcheck="false" rows="12"></textarea></details>
      <footer><span id="rewriteValidation">표현 필드를 수정하세요.</span><button id="saveRewrite" type="button" class="approve">수정본 확정</button></footer>
    </form>
  </dialog>

  <dialog id="bulkDialog"><form method="dialog"><div class="dialog-mark">!</div><h2>현재 목록 일괄 처리</h2><p id="bulkDescription"></p><label>처리 방식<select id="bulkAction"><option value="APPROVE_A">A 승인</option><option value="APPROVE_B">B 승인</option><option value="DROP">폐기</option></select></label><label>확인 문구<input id="bulkConfirmation" autocomplete="off"></label><div class="dialog-actions"><button value="cancel" class="quiet">취소</button><button id="confirmBulk" value="default" class="danger">일괄 적용</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
