name: Development checkout

on:
  pull_request:
    paths:
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/development-checkout.yml'
      - 'tools/Repository/**'
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Artifacts/**'
  push:
    branches: [main]
    paths:
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/development-checkout.yml'
      - 'tools/Repository/**'
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Artifacts/**'

permissions:
  contents: read

jobs:
  verify-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test atomic model restoration
        run: python -m unittest discover -s tools/Repository -p "test_*.py"
      - name: Restore exact R80 model from verified LFS parts
        run: python tools/Repository/restore_r80_model.py

      - run: python tools/Repository/verify_checkout.py
