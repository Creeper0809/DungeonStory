name: V27 ledger integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Assets/**"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/v27-ledger-integrity.yml"
      - "tools/V27Balance/**"
      - "tools/DungeonStory.BalanceAnalyzers/**"
      - "Assets/Analyzers/**"
      - "Assets/Scripts/**"
      - "Assets/Resources/**"
      - "Assets/Scenes/GameplayScene.unity"
      - "Packages/**"
      - "ProjectSettings/**"
      - "Artifacts/QA/ImpactCI/**"
      - "Artifacts/QA/v27-*"
      - "docs/implementation-reports/world-resource-runtime-latest.txt"
      - "docs/implementation-reports/crop-plot-runtime-latest.txt"
      - "Artifacts/QA/v26-equipment-readiness-throughput.md"
      - "Artifacts/QA/v27-labor-authority-matrix.txt"
      - "Artifacts/QA/combat-balance-final/**"
      - "Artifacts/QA/combat-balance-final.txt"
      - "Artifacts/QA/final-acceptance-report.txt"
      - "Artifacts/QA/phase157-daily-routine-wu-seed-*.txt"
      - "docs/generated/V27_Balance_Before_After.md"
      - "docs/game-design/v27-balance-critical-approvals.json"
      - "docs/game-design/v27-balance-market-review-decisions.json"
      - "docs/game-design/whole-game-balance-baseline.md"
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/v27-ledger-integrity.yml"
      - "tools/V27Balance/**"
      - "tools/DungeonStory.BalanceAnalyzers/**"
      - "Assets/Analyzers/**"
      - "Assets/Scripts/**"
      - "Assets/Resources/**"
      - "Assets/Scenes/GameplayScene.unity"
      - "Packages/**"
      - "ProjectSettings/**"
      - "Artifacts/QA/ImpactCI/**"
      - "Artifacts/QA/v27-*"
      - "docs/implementation-reports/world-resource-runtime-latest.txt"
      - "docs/implementation-reports/crop-plot-runtime-latest.txt"
      - "Artifacts/QA/v26-equipment-readiness-throughput.md"
      - "Artifacts/QA/v27-labor-authority-matrix.txt"
      - "Artifacts/QA/combat-balance-final/**"
      - "Artifacts/QA/combat-balance-final.txt"
      - "Artifacts/QA/final-acceptance-report.txt"
      - "Artifacts/QA/phase157-daily-routine-wu-seed-*.txt"
      - "docs/generated/V27_Balance_Before_After.md"
      - "docs/game-design/v27-balance-critical-approvals.json"
      - "docs/game-design/v27-balance-market-review-decisions.json"
      - "docs/game-design/whole-game-balance-baseline.md"

permissions:
  contents: read

jobs:
  verify-committed-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with LFS evidence
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned identity verifier dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Set up pinned analyzer runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.421"

      - name: Rebuild and verify Roslyn analyzer
        run: python tools/DungeonStory.BalanceAnalyzers/verify_analyzer.py --dotnet dotnet

      - name: Test evidence binding rejection paths
        run: python -m unittest discover -s tools/V27Balance -p "test_*.py"

      - name: Verify published content identities remain compatible
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          COMPARISON_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          python tools/V27Balance/verify_content_identities.py --base "$COMPARISON_BASE" --head "$HEAD_SHA"

      - name: Verify changed-domain execution and archived evidence bytes
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/V27Balance/verify_change_scope.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Full release balance certification (explicit run)
        if: github.event_name == 'workflow_dispatch'
        run: python tools/V27Balance/verify_committed_artifacts.py
